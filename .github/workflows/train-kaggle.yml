name: Train on Kaggle

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Number of training epochs'
        required: false
        default: '3'
      batch_size:
        description: 'Batch size'
        required: false
        default: '8'
      experiment_id:
        description: 'Experiment ID for tracking'
        required: false
        default: 'manual_run'
      n_folds:
        description: 'Number of CV folds (0 for single split)'
        required: false
        default: '5'
  push:
    branches:
      - 'experiment/**'

concurrency:
  group: kaggle-train-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.10'

jobs:
  trigger-kaggle:
    name: Trigger Kaggle Training
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_GH_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Kaggle CLI
        run: |
          pip install kaggle
          mkdir -p ~/.kaggle
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Prepare kernel metadata
        run: |
          # Update kernel-metadata.json with actual username
          cd kaggle
          sed -i "s/INSERT_USERNAME/${{ secrets.KAGGLE_USERNAME }}/g" kernel-metadata.json
          
          # Show prepared metadata
          echo "=== Kernel Metadata ==="
          cat kernel-metadata.json

      - name: Push kernel to Kaggle
        id: push_kernel
        run: |
          cd kaggle
          
          # Extract kernel_id from metadata.json
          KERNEL_ID=$(cat kernel-metadata.json | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Using kernel_id: $KERNEL_ID"
          
          # Set environment variables for the kernel
          export EXPERIMENT_ID="${{ github.event.inputs.experiment_id || github.ref_name }}"
          export COMMIT_SHA="${{ github.sha }}"
          export BRANCH_NAME="${{ github.ref_name }}"
          export EPOCHS="${{ github.event.inputs.epochs || '5' }}"
          export BATCH_SIZE="${{ github.event.inputs.batch_size || '8' }}"
          export N_FOLDS="${{ github.event.inputs.n_folds || '5' }}"
          
          echo "Pushing kernel to Kaggle..."
          kaggle kernels push
          
          echo "kernel_id=$KERNEL_ID" >> $GITHUB_OUTPUT

      - name: Wait for kernel completion
        id: wait_kernel
        run: |
          KERNEL_ID="${{ steps.push_kernel.outputs.kernel_id }}"
          echo "Waiting for kernel: $KERNEL_ID"
          
          MAX_WAIT=21600  # 6 hours in seconds
          POLL_INTERVAL=120  # 2 minutes (reduced from 5)
          ELAPSED=0
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            # Get full status output for debugging
            FULL_STATUS=$(kaggle kernels status "$KERNEL_ID" 2>&1 || echo "error getting status")
            echo "Full status output: $FULL_STATUS"
            
            # Try multiple parsing methods
            STATUS="unknown"
            
            # Method 1: Look for "has status" pattern
            if echo "$FULL_STATUS" | grep -qi "has status.*complete"; then
              STATUS="complete"
            elif echo "$FULL_STATUS" | grep -qi "has status.*running"; then
              STATUS="running"
            elif echo "$FULL_STATUS" | grep -qi "has status.*error"; then
              STATUS="error"
            elif echo "$FULL_STATUS" | grep -qi "has status.*cancel"; then
              STATUS="cancelled"
            # Method 2: Check for "complete" anywhere
            elif echo "$FULL_STATUS" | grep -qi "complete"; then
              STATUS="complete"
            fi
            
            echo "Parsed status: $STATUS (elapsed: ${ELAPSED}s)"
            
            if [ "$STATUS" = "complete" ]; then
              echo "Kernel completed successfully!"
              echo "status=complete" >> $GITHUB_OUTPUT
              exit 0
            elif [ "$STATUS" = "error" ] || [ "$STATUS" = "cancelled" ]; then
              echo "Kernel failed with status: $STATUS"
              echo "status=failed" >> $GITHUB_OUTPUT
              exit 1
            fi
            
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done
          
          echo "Timeout waiting for kernel"
          echo "status=timeout" >> $GITHUB_OUTPUT
          exit 1

      - name: Download kernel output
        if: steps.wait_kernel.outputs.status == 'complete'
        run: |
          KERNEL_ID="${{ steps.push_kernel.outputs.kernel_id }}"
          mkdir -p output
          kaggle kernels output "$KERNEL_ID" -p output/
          
          echo "=== Downloaded Files ==="
          ls -la output/
          
          if [ -f output/metrics.json ]; then
            echo "=== Metrics ==="
            cat output/metrics.json
          fi

      - name: Upload metrics artifact
        if: steps.wait_kernel.outputs.status == 'complete'
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-training-results
          path: output/
          retention-days: 90

      - name: Submit to competition
        id: submit
        if: steps.wait_kernel.outputs.status == 'complete'
        run: |
          echo "=== Checking for submission.csv ==="
          if [ -f output/submission.csv ]; then
            ROW_COUNT=$(wc -l < output/submission.csv)
            echo "Found submission.csv with $ROW_COUNT rows"
            
            # Build submission message
            COMMIT_SHORT="${GITHUB_SHA::7}"
            BRANCH="${{ github.ref_name }}"
            MSG="${BRANCH} ${COMMIT_SHORT} via Actions"
            
            echo "Submitting to competition: $MSG"
            kaggle competitions submit \
              -c medical-ai-contest-7th-2025 \
              -f output/submission.csv \
              -m "$MSG"
            
            echo "submitted=true" >> $GITHUB_OUTPUT
            echo "✅ Submission uploaded"
          else
            echo "⚠️ No submission.csv found in output/"
            ls -la output/
            echo "submitted=false" >> $GITHUB_OUTPUT
          fi

      - name: Get LB score
        id: score
        if: steps.submit.outputs.submitted == 'true'
        run: |
          echo "Waiting for Kaggle scoring..."
          # Build submission identity token for matching
          COMMIT_SHORT="${GITHUB_SHA::7}"
          BRANCH="${{ github.ref_name }}"
          SUBMIT_TOKEN="${BRANCH} ${COMMIT_SHORT} via Actions"
          echo "Looking for submission with description: $SUBMIT_TOKEN"
          sleep 90
          
          SCORE="pending"
          for i in $(seq 1 20); do
            echo "Attempt $i/20..."
            
            SUBMISSIONS=$(kaggle competitions submissions \
              -c medical-ai-contest-7th-2025 --csv 2>/dev/null || echo "")
            
            if [ -n "$SUBMISSIONS" ]; then
              # Parse by header + match our submission description
              SCORE=$(echo "$SUBMISSIONS" | python3 -c "
          import sys, csv
          reader = csv.DictReader(sys.stdin)
          token = '$SUBMIT_TOKEN'
          for row in reader:
              desc = row.get('description', row.get('Description', ''))
              if token and token not in desc:
                  continue
              score = row.get('publicScore', row.get('score', ''))
              if score and score != 'None':
                  try:
                      float(score)
                      print(score)
                      sys.exit(0)
                  except ValueError:
                      pass
          # Fallback: first row with valid score
          sys.stdin.seek(0) if hasattr(sys.stdin, 'seek') else None
          print('pending')
          " 2>/dev/null <<< "$SUBMISSIONS" || echo "pending")
              
              if [ "$SCORE" != "pending" ] && [ "$SCORE" != "None" ] && [ -n "$SCORE" ]; then
                echo "LB Score: $SCORE"
                echo "score=$SCORE" >> $GITHUB_OUTPUT
                break
              fi
            fi
            
            echo "Score not ready yet, waiting 30s..."
            sleep 30
          done
          
          if [ "$SCORE" = "pending" ]; then
            echo "Could not retrieve score after 20 attempts"
            echo "score=pending" >> $GITHUB_OUTPUT
          fi


      - name: Auto-improve config
        id: improve
        if: steps.score.outputs.score != 'pending' && steps.score.outputs.score != ''
        run: |
          echo "=== Running Auto-Improvement Engine ==="
          SCORE="${{ steps.score.outputs.score }}"
          
          RESULT=$(python scripts/auto_improve.py --score "$SCORE" --config kaggle/train_notebook.py 2>&1)
          echo "$RESULT"
          
          # Check if script output STOP or CONTINUE
          if echo "$RESULT" | grep -q "STOP"; then
            echo "action=stop" >> $GITHUB_OUTPUT
            echo "🛑 Auto-improvement loop stopped"
          else
            echo "action=continue" >> $GITHUB_OUTPUT
            echo "✅ Improvements applied, will commit and push"
          fi

      - name: Codex review (optional)
        if: steps.improve.outputs.action == 'continue'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "Running Codex review..."
            npm install -g @openai/codex 2>/dev/null || true
            npx @openai/codex review --uncommitted 2>&1 | head -100 || true
          else
            echo "OPENAI_API_KEY not set, skipping Codex review"
          fi

      - name: Commit and push improvements
        if: steps.improve.outputs.action == 'continue'
        env:
          MY_GH_TOKEN: ${{ secrets.MY_GH_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Debug: check token availability
          if [ -n "$MY_GH_TOKEN" ]; then
            echo "Using MY_GH_TOKEN for push"
            PUSH_TOKEN="$MY_GH_TOKEN"
          else
            echo "WARNING: MY_GH_TOKEN not set, falling back to GITHUB_TOKEN"
            echo "NOTE: GITHUB_TOKEN pushes will NOT re-trigger workflows"
            PUSH_TOKEN="$FALLBACK_TOKEN"
          fi
          
          # Set remote URL with token for push authentication
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          
          # Verify remote URL is set (masked)
          echo "Remote URL set to: https://x-access-token:***@github.com/${{ github.repository }}.git"
          
          SCORE="${{ steps.score.outputs.score }}"
          ITERATION=$(python -c "import json; print(json.load(open('experiments/auto_iterations.json'))['iteration'])")
          IMPROVEMENT=$(python -c "import json; h=json.load(open('experiments/auto_iterations.json'))['history']; print(h[-1].get('improvement','unknown') if h else 'unknown')")
          
          # Only add files that auto_improve.py modifies (avoid .github/workflows which needs workflow PAT scope)
          git add kaggle/train_notebook.py experiments/ 2>/dev/null || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          
          git commit -m "auto[$ITERATION]: $IMPROVEMENT (prev score: $SCORE)"
          
          # Show what we're pushing
          echo "Pushing to ${{ github.ref_name }}..."
          git log --oneline -1
          
          # Rebase before push to handle any concurrent commits
          git pull --rebase origin ${{ github.ref_name }} 2>&1 || true
          
          # Push with verbose output for debugging
          git push origin HEAD:${{ github.ref_name }} 2>&1 || {
            echo "ERROR: git push failed!"
            echo "This usually means the token lacks 'Contents: write' permission."
            echo "Please check: Settings -> Secrets -> MY_GH_TOKEN has 'repo' scope (classic) or 'Contents: Read and write' (fine-grained)."
            exit 1
          }
          echo "Pushed! Next training cycle will trigger automatically."

      - name: Post summary
        if: always()
        run: |
          echo "## 🚀 Kaggle Training Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ steps.wait_kernel.outputs.status || 'pending' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Submitted**: ${{ steps.submit.outputs.submitted || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Public Score**: ${{ steps.score.outputs.score || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Auto-Improve**: ${{ steps.improve.outputs.action || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f experiments/auto_iterations.json ]; then
            echo "### Iteration History" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat experiments/auto_iterations.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f output/metrics.json ]; then
            echo "### CV Metrics" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat output/metrics.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
